name: Rewrite release notes from PR markers

# Tested and ruled out: reacting to `release: created` while draft==true, to
# fix notes before anyone publishes and creates the tag. GitHub Actions does
# not fire the `release` event for draft creation at all — confirmed by
# creating a real draft release here and observing zero workflow runs. So
# there is no server-side moment between "release+tag created together" and
# "tag pushed" for a direct (non-draft) release — they happen atomically.
#
# What IS achievable: finishing before the notes are actually *read* by
# anything downstream. build-binary.yml triggers on this same tag push and
# runs a multi-OS build + PyPI/Artifact-Registry publish chain that takes
# minutes before its last job calls send-release-email.yml. Triggering here
# on the identical tag push runs this in parallel with that chain — composing
# notes is a handful of API calls (seconds), so it reliably finishes and
# corrects the release body long before send-release-email.yml's job is
# reached, even though the tag/build already started.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  rewrite-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compose notes from PR release-note markers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # A tag can be pushed without a Release object existing yet (e.g. a
          # bare `git push --tags`) — nothing to edit in that case, skip.
          if ! gh release view "$TAG_NAME" --repo "$REPO" >/dev/null 2>&1; then
            echo "No release found for tag $TAG_NAME, skipping."
            exit 0
          fi

          python3 tools/release_notes/extract.py \
            --repo "$REPO" \
            --tag "$TAG_NAME" \
            > /tmp/notes.md

          gh release edit "$TAG_NAME" --repo "$REPO" --notes-file /tmp/notes.md
