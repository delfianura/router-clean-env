name: Rewrite release notes from PR markers

# The tag is created the moment a NON-draft release is created (`gh release
# create` with no --draft, or the UI's one-shot "Publish release" on a fresh
# tag) — and tag push is what fires build-binary.yml, which fires
# send-release-email.yml at the end. There is no server-side moment between
# "release exists with default/wrong notes" and "tag pushed, downstream
# workflows already running" for that path — GitHub creates both atomically.
#
# The only way to guarantee correct notes BEFORE the tag exists is to react
# to `release: created` while the release is still a draft: drafting (via
# `gh release create --draft` or the UI's "Save draft") creates the release
# object — including whatever "Generate release notes" produced — without
# creating the tag. The tag is only created when the draft is later
# published. So: rewrite immediately on draft creation, before anyone
# publishes it.
#
# `released` is kept as a best-effort fallback for anyone who publishes
# directly without drafting first — by then the tag has already fired
# build-binary.yml, but the release notes themselves are still corrected
# after the fact rather than left wrong permanently.
on:
  release:
    types: [created, released]

permissions:
  contents: write

jobs:
  rewrite-notes:
    if: github.event.release.draft == true || github.event.action == 'released'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compose notes from PR release-note markers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          python3 tools/release_notes/extract.py \
            --repo "$REPO" \
            --tag "$TAG_NAME" \
            > /tmp/notes.md

          gh release edit "$TAG_NAME" --notes-file /tmp/notes.md
